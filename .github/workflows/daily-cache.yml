name: Daily Cache Collection

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-cache:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        
    - name: Create cache directories
      run: |
        mkdir -p time-travel-cache/daily/$(date -d "yesterday" +%Y)/$(date -d "yesterday" +%m)
        
    - name: Fetch yesterday's data (legacy daily for Pudding*)
      run: node scripts/historical-cache-backfill.js --yesterday
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}
      continue-on-error: true

    - name: Update available dates metadata (legacy daily)
      run: node scripts/generate-available-dates.js
      continue-on-error: true

    - name: Sync mastery challenge (incremental; no-op until full backfill)
      run: node scripts/mastery-challenge-fetcher.js --incremental
      continue-on-error: true

    - name: Sync verified runs archive (incremental; no-op until full backfill)
      run: node scripts/runs-archive-fetcher.js --incremental
      continue-on-error: true

    - name: Rebuild FSS stats (runs archive when ready, else legacy daily)
      run: |
        if [ -f time-travel-cache/metadata/runs-archive-state.json ] && \
           node -e "const s=require('./time-travel-cache/metadata/runs-archive-state.json'); process.exit(s.backfillComplete?0:1)"; then
          echo "Using runs archive for FSS stats"
          node scripts/derive-runs-timelines.js
          node scripts/player-stats-analyzer.js --from-runs
          node scripts/statistics-explorer-analyzer.js --from-runs --full
        else
          echo "Runs archive not ready — using legacy daily cache for stats"
          node scripts/player-stats-analyzer.js
          node scripts/statistics-explorer-analyzer.js
        fi
      continue-on-error: true
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update daily cache data" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}
