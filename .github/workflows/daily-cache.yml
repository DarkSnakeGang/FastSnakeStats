name: Daily Cache Collection

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-cache:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        
    - name: Create cache directories
      run: |
        mkdir -p time-travel-cache/daily/$(date -d "yesterday" +%Y)/$(date -d "yesterday" +%m)
        
    - name: Fetch yesterday's data
      run: node scripts/historical-cache-backfill.js --yesterday
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}
      continue-on-error: true

    - name: Update available dates metadata
      run: node scripts/generate-available-dates.js
      continue-on-error: true

    - name: Rebuild player peak stats
      run: node scripts/player-stats-analyzer.js
      continue-on-error: true

    - name: Rebuild statistics explorer metadata
      run: node scripts/statistics-explorer-analyzer.js
      continue-on-error: true

    - name: Sync mastery challenge (incremental; no-op until full backfill)
      run: node scripts/mastery-challenge-fetcher.js --incremental
      continue-on-error: true
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update daily cache data" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}
