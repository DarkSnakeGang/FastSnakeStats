name: Daily Cache Collection

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-cache:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: false
        

        
    - name: Create cache directories
      run: |
        mkdir -p time-travel-cache/daily/$(date -d "yesterday" +%Y)/$(date -d "yesterday" +%m)
        mkdir -p time-travel-cache/daily/2018/10
        
    - name: Fetch yesterday's data
      run: node scripts/historical-cache-backfill.js --yesterday
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}
      continue-on-error: true
        
    - name: Update metadata
      run: node scripts/update-metadata.js
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update daily cache data" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}


