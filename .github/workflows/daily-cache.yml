name: Daily Cache Collection

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-cache:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        
    - name: Sync mastery challenge (incremental; no-op until full backfill)
      run: node scripts/mastery-challenge-fetcher.js --incremental
      continue-on-error: true

    - name: Sync verified runs archive (incremental)
      id: runs-sync
      run: node scripts/runs-archive-fetcher.js --incremental
      continue-on-error: true

    - name: Sync player countries (incremental SRC locations)
      if: steps.runs-sync.outcome == 'success'
      continue-on-error: true
      run: node scripts/player-locations-fetcher.js --incremental

    - name: Rebuild FSS runs-derived timelines and stats
      id: fss-rebuild
      if: steps.runs-sync.outcome == 'success'
      continue-on-error: true
      run: |
        if [ ! -f time-travel-cache/metadata/runs-archive-state.json ]; then
          echo "Missing runs-archive-state.json — cannot rebuild FSS stats"
          exit 1
        fi
        if ! node -e "const s=require('./time-travel-cache/metadata/runs-archive-state.json'); process.exit(s.backfillComplete?0:1)"; then
          echo "Runs archive backfill incomplete — skipping FSS stats (will not overwrite with legacy daily)"
          exit 0
        fi
        echo "Deriving WR timelines from runs archive…"
        node scripts/derive-runs-timelines.js
        echo "Rebuilding player stats from runs…"
        node scripts/player-stats-analyzer.js --from-runs
        echo "Rebuilding statistics explorer from runs…"
        node scripts/statistics-explorer-analyzer.js --from-runs --full
        echo "Building Chronicle…"
        node scripts/chronicle-analyzer.js

    - name: Materialize latest daily cache from runs data
      if: steps.fss-rebuild.outcome == 'success'
      continue-on-error: true
      run: node scripts/materialize-runs-daily-cache.js --yesterday

    - name: Prune daily cache (keep latest date only)
      run: node scripts/prune-daily-cache.js
      continue-on-error: true

    - name: Update available dates metadata (daily snapshots)
      run: node scripts/generate-available-dates.js
      continue-on-error: true
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update daily cache data" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.FSSGSM_TOKEN }}

    - name: Report FSS pipeline status
      if: always()
      run: |
        if [ "${{ steps.runs-sync.outcome }}" != "success" ]; then
          echo "Runs archive sync failed — FSS timelines/stats were not refreshed from SRC"
          exit 1
        fi
        if [ "${{ steps.fss-rebuild.outcome }}" = "failure" ]; then
          echo "Runs sync OK but FSS derive/stats rebuild failed — backup Analyze Player Statistics should retry"
          exit 1
        fi
        echo "Runs sync and FSS rebuild completed successfully"
