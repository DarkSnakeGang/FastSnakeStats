name: Analyze Player Statistics

on:
  # Run after update-available-dates workflow completes
  workflow_run:
    workflows: ["Update Available Dates Metadata"]
    types: [completed]
    branches: [main]
  
  # Run manually
  workflow_dispatch:

jobs:
  analyze-player-stats:
    runs-on: ubuntu-latest
    
    # Run on manual dispatch, or when the triggering workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
    
    - name: Run player statistics analysis
      run: node scripts/player-stats-analyzer.js

    - name: Run statistics explorer analysis
      run: node scripts/statistics-explorer-analyzer.js
    
    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet time-travel-cache/metadata/player-stats.json time-travel-cache/metadata/statistics-explorer.json; then
          echo "No changes detected in stats metadata"
          echo "has-changes=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected in stats metadata"
          echo "has-changes=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.check-changes.outputs.has-changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add time-travel-cache/metadata/player-stats.json time-travel-cache/metadata/statistics-explorer.json
        git commit -m "Update player and explorer statistics [skip ci]"
        git push
    
    - name: No changes message
      if: steps.check-changes.outputs.has-changes == 'false'
      run: |
        echo "No changes to commit - statistics metadata is up to date"
