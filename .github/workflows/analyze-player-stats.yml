name: Analyze Player Statistics

on:
  # Backup rebuild after daily cache (runs fetch + derive + stats already run there).
  # Kept so a partial daily commit still gets runs-derived stats without touching legacy daily.
  workflow_run:
    workflows: ["Daily Cache Collection"]
    types: [completed]
    branches: [main]
  
  # Run manually
  workflow_dispatch:

jobs:
  analyze-player-stats:
    runs-on: ubuntu-latest
    
    # Manual, or after daily cache finishes (success or failure).
    # Failure path covers "runs committed but derive/stats rebuild failed".
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
    
    - name: Rebuild FSS stats from runs archive
      run: |
        if [ ! -f time-travel-cache/metadata/runs-archive-state.json ]; then
          echo "Missing runs-archive-state.json — skipping"
          exit 0
        fi
        if ! node -e "const s=require('./time-travel-cache/metadata/runs-archive-state.json'); process.exit(s.backfillComplete?0:1)"; then
          echo "Runs archive backfill incomplete — skipping (will not overwrite with legacy daily)"
          exit 0
        fi
        echo "Deriving WR timelines from runs archive…"
        node scripts/derive-runs-timelines.js
        echo "Rebuilding player stats from runs…"
        node scripts/player-stats-analyzer.js --from-runs
        echo "Rebuilding statistics explorer from runs…"
        node scripts/statistics-explorer-analyzer.js --from-runs --full
    
    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet \
            time-travel-cache/metadata/player-stats.json \
            time-travel-cache/metadata/statistics-explorer.json \
            time-travel-cache/metadata/available-dates-runs.json \
            time-travel-cache/runs-derived/wr-timelines.json; then
          echo "No changes detected in runs-derived FSS metadata"
          echo "has-changes=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected in runs-derived FSS metadata"
          echo "has-changes=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.check-changes.outputs.has-changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add \
          time-travel-cache/metadata/player-stats.json \
          time-travel-cache/metadata/statistics-explorer.json \
          time-travel-cache/metadata/available-dates-runs.json \
          time-travel-cache/runs-derived/wr-timelines.json
        git commit -m "Update player and explorer statistics [skip ci]"
        git push
    
    - name: No changes message
      if: steps.check-changes.outputs.has-changes == 'false'
      run: |
        echo "No changes to commit - statistics metadata is up to date"
