<!DOCTYPE html>
<html>
        <head>
		<title>FastSnakeStats</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="https://www.google.com/logos/fnbx/snake_arcade/v3/trophy_00.png" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <script src="WorldRecordFetcher.js" defer></script>
        <script src="data-management.js" defer></script>
        <script src="api-fetcher.js" defer></script>
        <script src="ui-generator.js" defer></script>
        <script src="event-handlers.js" defer></script>
        <script src="mobile-ui.js" defer></script>
        <script src="main.js" defer></script>
	</head>

	<body>
                <!-- Mobile Header -->
                <header class="mobile-header">
                        <h1>FastSnakeStats</h1>
                        <div class="mobile-header-actions">
                                <button class="mobile-header-btn" id="mobileInfoBtn" title="Info">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="12" r="10"></circle>
                                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                        </svg>
                                </button>
                                <button class="mobile-header-btn" id="mobileSettingsBtn" title="Settings">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="12" r="3"></circle>
                                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                        </svg>
                                </button>
                        </div>
                </header>

                <!-- Mobile Main Content -->
                <main class="mobile-main">
                        <!-- Mobile Tables Container -->
                        <div id="mobileTablesContainer">
                                <!-- Tables will be generated here -->
                        </div>

                        <!-- Mobile Loading State -->
                        <div class="mobile-loading" id="mobileLoading" style="display: none;">
                                <div class="mobile-spinner"></div>
                                <span>Loading world records...</span>
                        </div>

                        <!-- Mobile Empty State -->
                        <div class="mobile-empty" id="mobileEmpty" style="display: none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                        <line x1="12" y1="12" x2="12" y2="16"></line>
                                </svg>
                                <p>No data available</p>
                                <p>Select a game mode to view world records</p>
                        </div>
                </main>

                <!-- Mobile Navigation -->
                <nav class="mobile-nav">
                        <a href="#" class="mobile-nav-item" data-section="settings">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                                <span>Settings</span>
                        </a>
                        <a href="#" class="mobile-nav-item active" data-section="records">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14,2 14,8 20,8"></polyline>
                                        <line x1="16" y1="13" x2="8" y2="13"></line>
                                        <line x1="16" y1="17" x2="8" y2="17"></line>
                                        <polyline points="10,9 9,9 8,9"></polyline>
                                </svg>
                                <span>Records</span>
                        </a>
                        <a href="#" class="mobile-nav-item" data-section="summary">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="8" y1="6" x2="21" y2="6"></line>
                                        <line x1="8" y1="12" x2="21" y2="12"></line>
                                        <line x1="8" y1="18" x2="21" y2="18"></line>
                                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                </svg>
                                <span>Summary</span>
                        </a>
                </nav>

                <!-- Mobile Settings Panel -->
                <div class="mobile-settings-panel" id="mobileSettingsPanel">
                        <div class="mobile-settings-content">
                                <div class="mobile-settings-header">
                                        <h3 class="mobile-settings-title">Settings</h3>
                                        <button class="mobile-settings-close" id="mobileSettingsClose">×</button>
                                </div>
                                
                                <div class="mobile-form-group">
                                        <label class="mobile-form-label" for="mobileDatePicker">Pick a date to travel back in time</label>
                                        <input type="date" id="mobileDatePicker" class="mobile-form-input">
                                </div>

                                <div class="mobile-form-group">
                                        <label class="mobile-form-label">Game Categories</label>
                                        <div id="mobileCategorySettings">
                                                <!-- Category settings will be generated here -->
                                        </div>
                                </div>

                                <div class="mobile-form-group">
                                        <label class="mobile-form-label">Other Settings</label>
                                        <div id="mobileOtherSettings">
                                                <!-- Other settings will be generated here -->
                                        </div>
                                </div>

                                <div class="mobile-btn-group">
                                        <button class="mobile-btn" id="mobileSettingsSave">Save Settings</button>
                                        <button class="mobile-btn secondary" id="mobileSettingsCancel">Cancel</button>
                                </div>
                        </div>
                </div>

                <!-- Desktop Elements (hidden on mobile) -->
                <button id="infoBtn" class="modal-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </button>
                <button id="settingsBtn" class="modal-button2">
                        <svg style="width: 2em;" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                                        </button>
                <h1>FastSnakeStats</h1>

                <button id="switchButton" style="display:none">Click here to go to Category Extensions</button>
                <!-- Loading screen removed -->
                <div class = "container"></div>

                <div id="infoModal" class="modal">
                  <div class="modal-content">
                    <span class="close">&times;</span>
                    <p>Made By <strong>Yarmiplay</strong></p>
                    <p>Last Updated <span id="currentDate"></span></p>
                                         <p>Credit to Google for Images used</p>
                     <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                         <a href = "https://www.speedrun.com/snake_game">Speedrun.com</a>
                         <a href = "https://allapplecalc.netlify.app/">All Apple Calc</a>
                         <a href = "https://snakestats.netlify.app/">Old SnakeStats</a>
                     </div>
                  </div>

                </div>

                <div id="settingsModal" class="modal">

                  <!-- Modal content -->
                  <div class="modal-content">
                        <p><strong>Settings</strong></p>

                                <div class="settings-form-item">
            <label for="date">Pick a date to travel back in time</label>
            <input type="date" id="datepicker">
        </div>
        
                        <div id="optionButtons">
                        </div>
                  </div>

                </div>
	</body>

</html>
